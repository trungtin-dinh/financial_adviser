name: Public Streamlit browser smoke

on:
  workflow_run:
    workflows: ["Python and UX checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Exercise public application in real browser
        env:
          APP_URL: https://financial-adviser.streamlit.app
        run: python tests/live_browser_smoke.py
      - name: Upload live review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-streamlit-review
          path: artifacts/live
          if-no-files-found: ignore

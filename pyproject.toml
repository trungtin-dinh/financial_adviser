[project]
name = "financial-adviser"
version = "0.1.0"
description = "Educational and transparent financial projections for France and Vietnam"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.54,<2", "numpy>=1.26,<3", "pandas>=2.2,<3", "plotly>=5.24,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
